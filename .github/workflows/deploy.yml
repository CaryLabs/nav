name: Build and Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 定时刷新 RSS / projects 仓库元信息（GitHub Actions 的 cron 使用 UTC 时区）
    - cron: '0 2 * * *'

# 设置GITHUB_TOKEN的权限
permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write
  id-token: write

# 允许一个并发部署
concurrency:
  # 说明：
  # - 本工作流在检测到 bookmarks/*.html 时会自动导入，并推到 automation/bookmarks-sync 分支开 PR（main 受分支保护）
  # - 若 concurrency group 统一为固定值，会导致“自触发的 push run”取消当前正在部署的 run（cancel-in-progress）
  # - 这里仅对 actions bot 的 push run 单独分组，避免误取消当前 run；其余触发保持全局串行
  group: ${{ github.event_name == 'push' && github.actor == 'github-actions[bot]' && 'pages-bot-push' || 'pages' }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    # 防自触发：CI 自己 push 产生的 push 事件不需要再部署（本次 run 已完成导入并继续部署）
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # 使用persist-credentials: false，以便后续步骤可以使用自定义的提交者
        with:
          persist-credentials: false
          fetch-depth: 0 # 获取所有历史记录以进行diff检查

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- 书签处理步骤 ---
      - name: Check for bookmark HTML files
        id: check_bookmark_files
        run: |
          if [ -d bookmarks ] && [ "$(find bookmarks -type f -name "*.html" 2>/dev/null)" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Bookmark HTML files found, will process them."
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No bookmark HTML files found, skipping bookmark processing."
          fi

      - name: Process bookmark files
        if: steps.check_bookmark_files.outputs.found == 'true'
        env:
          MENAV_BOOKMARKS_DETERMINISTIC: '1'
        run: |
          echo "Processing bookmark files..."
          npm run import-bookmarks

      - name: Publish bookmark import via pull request
        if: steps.check_bookmark_files.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: automation/bookmarks-sync
        run: |
          set -euo pipefail

          # 校验导入结果（核心产物必须存在）
          if [ ! -f config/user/pages/bookmarks.yml ]; then
            echo "ERROR: config/user/pages/bookmarks.yml does not exist! Bookmark processing may have failed."
            echo "Directory listing for config/user/pages:"
            ls -la config/user/pages/ || echo "Directory does not exist"
            exit 1
          fi

          echo "Cleaning up processed bookmark HTML files..."
          HTML_FILES=$(find bookmarks -type f -name "*.html" 2>/dev/null || true)
          FILE_COUNT=0
          if [ -n "${HTML_FILES}" ]; then
            FILE_COUNT=$(echo "${HTML_FILES}" | wc -l | tr -d ' ')
            find bookmarks -type f -name "*.html" -delete
            echo "Removed ${FILE_COUNT} HTML files."
          else
            echo "No HTML files found to clean up."
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"

          # 注意：配置系统采用“完全替换”，一旦写回 config/user/，后续构建会忽略 config/_default/
          # 因此这里必须整体提交 config/user/（避免只提交书签页导致其它页面配置缺失）
          git add -A config/user bookmarks

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(bookmarks): 导入书签并写回用户配置"

          # main 已启用分支保护（必需检查 build_test、禁止直接推送），GITHUB_TOKEN 直推会被 GH006 拒绝。
          # 因此改为推到固定同步分支，再以 PR 形式合入 main。
          git checkout -B "${SYNC_BRANCH}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            "${SYNC_BRANCH}"

          # --- 以下仅 PR 发布环节：失败只告警，不阻断后续站点构建与部署 ---
          # 本次 run 的构建使用当前工作区（已含导入结果），所以 PR 环节失败不影响本次部署内容；
          # 上方的导入结果校验与 git push 仍在函数外，失败照旧中断部署。
          publish_pr() {
            local pr_url merge_err
            pr_url=$(gh pr list \
              --repo "${{ github.repository }}" \
              --head "${SYNC_BRANCH}" \
              --base main \
              --state open \
              --json url \
              --jq '.[0].url // ""') || return 1

            if [ -z "${pr_url}" ]; then
              local body="由 Build and Deploy Site 工作流自动创建。main 已启用分支保护（必需检查 build_test、禁止直接推送），书签导入结果不再直接 push，改为经 PR 合入；合并后本次导入的配置才会持久化到 main。"
              pr_url=$(gh pr create \
                --repo "${{ github.repository }}" \
                --base main \
                --head "${SYNC_BRANCH}" \
                --title "chore(bookmarks): 导入书签并写回用户配置" \
                --body "${body}") || return 1
              echo "Created PR: ${pr_url}"
            else
              echo "Reusing open PR: ${pr_url}"
            fi

            # 用 GITHUB_TOKEN 发起的 push / PR 不会触发新的 workflow run（GitHub 防递归），
            # ci.yml 的 pull_request 事件因此被抑制，必需检查 build_test 不会自动上报。
            # 这里显式 dispatch ci.yml（workflow_dispatch 不受该抑制影响），让 PR 能拿到必需检查。
            gh workflow run ci.yml \
              --repo "${{ github.repository }}" \
              --ref "${SYNC_BRANCH}" \
              || echo "::warning title=无法触发 CI::gh workflow run 失败，请手动在 PR 上触发检查后再合并"

            # 仓库开启 auto-merge 时，PR 会在 build_test 通过后自动合并；未开启则留给人工合并。
            if merge_err=$(gh pr merge "${pr_url}" --squash --auto 2>&1); then
              echo "Auto-merge enabled: ${pr_url}"
            else
              echo "::warning title=书签导入待合并::auto-merge 未启用或暂不可合并：${merge_err}"
              {
                echo "### 书签导入写回待人工合并"
                echo ""
                echo "PR：${pr_url}"
                echo ""
                echo '```'
                gh pr view "${pr_url}" --repo "${{ github.repository }}" \
                  --json mergeStateStatus,mergeable,statusCheckRollup \
                  --jq '{mergeStateStatus,mergeable,checks:[.statusCheckRollup[]?|{name,status,conclusion}]}' 2>&1 || true
                echo '```'
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
          }

          publish_pr || echo "::warning title=书签导入写回未完成::PR 发布失败，站点仍会以本次导入结果构建；请查看日志后手动补 PR"
      # --- 书签处理步骤结束 ---
      # --- 网站构建和部署步骤 ---
      # 同步时效性数据（best-effort）：projects 仓库信息、articles RSS 聚合
      # 说明：
      # - 同步结果写入 dev/（仓库默认 gitignore），仅用于本次构建渲染
      # - 同步脚本内部已做 best-effort（失败不阻断后续 build）
      - name: Sync dynamic caches (best-effort)
        run: npm run sync

      - name: Build site (clean dist + generate)
        env:
          # 站点部署基路径：GitHub Pages 项目站点位于 /<repo>/ 子路径下。
          # 若改为根域 / 自定义域部署，删除此项（默认即根路径）。
          MENAV_BASE_PATH: /nav
        run: npm run build

      - name: Check favicon
        run: |
          if [ -f dist/favicon.ico ]; then
            echo "Favicon exists"
            ls -l dist/favicon.ico
          else
            echo "Warning: favicon.ico not found in dist directory"
            # 暂时改为警告，避免因为图标问题阻止部署
            # exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser contract test (subpath /nav)
        env:
          # 与构建期一致的部署基路径，验证生产部署场景的路由契约
          MENAV_BASE_PATH: /nav
        run: npm run test:browser

      # GitHub Pages 部署步骤（仅在启用时执行）
      # 说明：
      # - 如果你使用 Vercel/Cloudflare Pages 等第三方平台部署，可以跳过这些步骤
      # - 设置 repository variable ENABLE_GITHUB_PAGES=false 来禁用 GitHub Pages 部署
      # - 默认启用 GitHub Pages 部署以保持向后兼容
      - name: Setup Pages
        if: ${{ vars.ENABLE_GITHUB_PAGES != 'false' }}
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: ${{ vars.ENABLE_GITHUB_PAGES != 'false' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        if: ${{ vars.ENABLE_GITHUB_PAGES != 'false' }}
        id: deployment
        uses: actions/deploy-pages@v4

# 默认页面配置（请勿直接修改）。
# 建议复制到 config/user/pages/common.yml 并按需调整。
title: 常用网站 # 页面标题
subtitle: Common website # 页面副标题

# 指定使用的内置页面类型（由 Astro 组件渲染）
# 说明：推荐使用通用页面类型 page；首页由“导航第一项”决定
template: page

# 页面分类与站点列表
categories:
  - name: 置顶
    icon: fas fa-star # 分类图标
    sites:
      - name: TrustMRR # 站点名称
        url: https://trustmrr.com/ # http/https URL（favicon 模式将尝试加载站点图标）
        icon: fas fa-money-bill-trend-up # 手动图标：manual 模式使用；favicon 模式下作为回退
        description: The database of verified startup revenues # 站点描述
      - name: keyword-generator # 站点名称
        url: https://ahrefs.com/keyword-generator/ # http/https URL（favicon 模式将尝试加载站点图标）
        icon: fas fa-key # 手动图标：manual 模式使用；favicon 模式下作为回退
        description: 关键词生成 # 站点描述
      - name: Web.Cafe # 站点名称
        url: https://new.web.cafe/ # http/https URL（favicon 模式将尝试加载站点图标）
        icon: fas fa-mug-hot # 手动图标：manual 模式使用；favicon 模式下作为回退
        description: SEO工具站 # 站点描述
